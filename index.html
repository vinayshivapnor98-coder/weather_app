```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container -->
    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>Weather App</h1>
            <p>Check your city's weather</p>
        </div>

        <!-- Search section -->
        <div class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-button">Search</button>
        </div>

        <!-- Weather information -->
        <div class="weather-card">
            <h2 id="city-name">Pune</h2>
            <div class="weather-icon">☀️</div>
            <h1 id="temperature">30°C</h1>
            <p id="condition">Sunny</p>
        </div>

        <!-- Additional details -->
        <div class="weather-details">
            <div class="detail-box">
                <p>Humidity</p>
                <h3 id="humidity">60%</h3>
            </div>

            <div class="detail-box">
                <p>Wind Speed</p>
                <h3 id="wind-speed">12 km/h</h3>
            </div>
        </div>

    </div>

    <script >
        const search = document.querySelector(".search-section");
        const search_by = document.getElementById("search-button");
        
        const city_name = document.getElementById("city-name");

        const getWeatherData= async () =>{
            const city = document.getElementById("city-input").value;
            const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=6ddf0ed46833fdda15db0d12a7b9df5a`;
            try{
                const res = await fetch(weatherUrl);
                const data = await res.json();
                
                console.log(data);
                const {main, name, weather, wind } = data;
                city_name.innerText=city;
                document.getElementById("temperature").innerText = `${main.temp}`;
                document.querySelector(".weather-icon").innerHTML = `${weather[0].icon}`
                document.getElementById("condition").innerHTML = `${weather[0].main}`;
                document.getElementById("humidity").innerHTML = `${main.humidity}%`;
                document.getElementById("wind-speed").innerHTML = `${wind.speed} Km/hr`;
                city_name.innerText= city;
                
            }catch(error){
                console.log(error);
            }
        };
        // document.body.addEventListener("load", getWeatherData());
        search_by.addEventListener("click", getWeatherData);
        
    </script>
</body>
</html>
```
